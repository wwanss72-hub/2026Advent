<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14102b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="대림절 묵상집">
<title>남학교회 대림절 묵상집</title>
<style>
:root{--bg:#e9e5f0;--card:#ffffff;--tx:#241c3d;--mut:#6d6585;--ac:#5a3d99;--ln:#ddd7ea;--flame:#e8a826;--wax:#efe8da;--p:#6b4aa8;--r:#d9799c;--c1:#4a2a8c;--c2:#a68be0;--c3:#e0589a;--c4:#f6bcd3;--c5:#ffffff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14102b;--card:#1f1a3d;--tx:#ece8f6;--mut:#a79fc2;--ac:#b9a1ee;--ln:#342d5a;--p:#8d6fd0;--r:#e58aab;--c1:#6a45b8;--c2:#b9a1ee;--c3:#ee6fa5;--c4:#f7c3d8;--c5:#f6f1e6}}
:root[data-theme="dark"]{--bg:#14102b;--card:#1f1a3d;--tx:#ece8f6;--mut:#a79fc2;--ac:#b9a1ee;--ln:#342d5a;--p:#8d6fd0;--r:#e58aab;--c1:#6a45b8;--c2:#b9a1ee;--c3:#ee6fa5;--c4:#f7c3d8;--c5:#f6f1e6}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Serif KR","Nanum Myeongjo","Apple SD Gothic Neo",serif;line-height:1.75}
main{max-width:560px;margin:0 auto;padding:20px 18px 56px}
h1{font-size:1.7rem;margin:0;font-weight:700;letter-spacing:-.01em;cursor:default;user-select:none;text-align:center}
.sub{color:var(--mut);font-size:.9rem;margin:2px 0 0;text-align:center}
.candles{display:flex;gap:26px;justify-content:center;align-items:flex-end;margin:26px 0 8px;height:96px}
.c{width:20px;border-radius:3px 3px 2px 2px;position:relative;background:var(--p);opacity:.45;height:56px}
.c1{background:var(--c1)}.c2{background:var(--c2)}.c3{background:var(--c3)}.c4{background:var(--c4)}
.c5{background:var(--c5);box-shadow:inset 0 0 0 1px var(--ln)}
.c.on{opacity:1}
.c.on::before{content:"";position:absolute;left:50%;top:-24px;width:12px;height:22px;margin-left:-6px;background:var(--flame);border-radius:50% 50% 50% 50%/65% 65% 35% 35%;box-shadow:0 0 16px 4px rgba(232,168,38,.55);animation:fl 2.4s ease-in-out infinite}
.c::after{content:"";position:absolute;left:50%;top:-4px;width:2px;height:5px;margin-left:-1px;background:var(--tx);opacity:.6}
@keyframes fl{50%{transform:scale(.92,1.06) rotate(-2deg)}}
@media (prefers-reduced-motion:reduce){.c.on::before{animation:none}}
.wk{text-align:center;color:var(--mut);font-size:.88rem;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:22px 20px}
.date{color:var(--mut);font-size:.85rem}
.ref{font-size:1.7rem;font-weight:700;margin:4px 0 2px;line-height:1.3}
.word{display:inline-block;color:var(--ac);font-size:.92rem;margin:0 0 12px}
.txt{border-left:3px solid var(--ac);padding:2px 0 2px 12px;margin:12px 0;font-size:1.03rem}
.ins{margin:14px 0; font-size:1.1rem;}
.q{background:var(--bg);border-radius:10px;padding:12px 14px;margin:14px 0}
.q b{display:block;font-size:.85rem;color:var(--ac);margin-bottom:2px}
textarea{width:100%;min-height:96px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);padding:10px 12px;font:inherit;font-size:.95rem;resize:vertical}
button{font:inherit;cursor:pointer}
.btn{width:100%;margin-top:12px;padding:13px;border-radius:10px;border:0;background:var(--ac);color:var(--bg);font-weight:700;font-size:1rem}
.btn.done{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.prog{margin-top:18px;padding-top:16px;border-top:1px solid var(--ln)}
.ph{display:flex;justify-content:space-between;align-items:baseline;font-size:.88rem;color:var(--mut)}
.ph b{font-size:1.25rem;color:var(--tx)}
.bar{height:12px;border-radius:6px;background:var(--bg);border:1px solid var(--ln);overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--p),var(--r),var(--flame));animation:grow .7s ease-out}
@keyframes grow{from{width:0}}
.pn{font-size:.82rem;color:var(--mut);text-align:right}
@media (prefers-reduced-motion:reduce){.bar i{animation:none}}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-top:22px}
.d{aspect-ratio:1;border-radius:10px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font-size:.88rem;position:relative;padding:0}
.d.sel{border:2px solid var(--ac);font-weight:700}
.d.done::after{content:"";position:absolute;right:5px;top:5px;width:7px;height:7px;border-radius:50%;background:var(--flame)}
.d:disabled{opacity:.35;cursor:default}
.note{text-align:center;color:var(--mut);font-size:.85rem;margin-top:16px}
.row{display:flex;gap:8px;margin-top:14px}
.row button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font-size:.9rem}
.banner{background:var(--card);border:1px dashed var(--ac);border-radius:12px;padding:12px 14px;margin-bottom:14px;text-align:center;font-size:.92rem}
.logo-box { text-align: center; margin: 16px 0 8px; }
.logo-box img { max-width: 150px; height: auto; border-radius: 0%; object-fit: cover; }
</style>
</head>
<body>
<main>
<h1 id="ttl">2026 남학교회 대림절 묵상집</h1>
<p class="sub">11월 29일 – 12월 25일 · 하루 한 구절</p>
<div class="candles" id="candles" aria-hidden="true"></div>
<div class="wk" id="wk"></div>
<div id="banner"></div>
<section class="card" id="card"></section>
<div class="grid" id="grid" role="list"></div>
<button class="btn" id="a2hs" style="margin-top:15px; margin-bottom:1px;">홈 화면에 저장하기</button>
<div class="card" id="a2hsBox" hidden style="margin-top:12px;font-size:.95rem"></div>  
<div class="row"><button id="share">친구에게 공유하기</button><button id="theme">화면 모드 바꾸기</button></div>
<div class="logo-box">
<img src="logo.png" alt="교회 로고">
</div>
<p class="note" id="foot"></p>
</main>
<script>
// ===== 설정 =====
const START = new Date(2026, 10, 29); // 2026-11-29 (대림절 첫째 주일)
const WEEKS = [["첫째 주","소망"],["둘째 주","평화"],["셋째 주","기쁨"],["넷째 주","사랑"]];
const D = [
["이사야 64:1–9","","※ 교회력으로 새해를 여는 대림절 첫 주일, 이사야 선지자는 닫힌 하늘을 향해 “하늘을 찢고(가르고) 내려오소서”라며 간절히 절규합니다. 이 기도는 단순한 기다림이 아니라, 오래된 단절을 끊어달라는 공동체의 탄식입니다. 하나님께서는 이 절규에 아들을 보내시는 것으로 응답하셨습니다. 예수께서 세례 받으실 때 하늘이 갈라졌고, 십자가에서 숨을 거두실 때 성전 휘장이 위에서 아래로 찢어지며 하나님과 우리 사이를 가로막던 장벽이 완전히 무너졌습니다. 이제 우리에게 필요한 것은 종말의 날짜를 계산하는 불안한 긴장이 아니라, 맡겨진 일상을 성실히 살아내는 ‘깨어 있음’의 자세입니다. 우리의 완벽한 경계심이 아니라 우리를 끝까지 붙드시는 하나님의 신실하심을 의지하며, 오늘 삶의 자리에서 주님의 오심을 기쁨으로 준비하는 복된 대림절이 되시기를 축원합니다.","하나님과 나 사이를 가로막고 있다고 느끼는 마음의 벽은 무엇인가요?","1 원하건대 주는 하늘을 가르고 강림하시고 주 앞에서 산들이 진동하기를 2 불이 섶을 사르며 불이 물을 끓임 같게 하사 주의 원수들이 주의 이름을 알게 하시며 이방 나라들로 주 앞에서 떨게 하옵소서 3 주께서 강림하사 우리가 생각하지 못한 두려운 일을 행하시던 그 때에 산들이 주 앞에서 진동하였사오니 4 주 외에는 자기를 앙망하는 자를 위하여 이런 일을 행한 신을 옛부터 들은 자도 없고 귀로 들은 자도 없고 눈으로 본 자도 없었나이다 5 주께서 기쁘게 공의를 행하는 자와 주의 길에서 주를 기억하는 자를 선대하시거늘 우리가 범죄하므로 주께서 진노하셨사오며 이 현상이 이미 오래 되었사오니 우리가 어찌 구원을 얻을 수 있으리이까 6 무릇 우리는 다 부정한 자 같아서 우리의 의는 다 더러운 옷 같으며 우리는 다 잎사귀 같이 시들므로 우리의 죄악이 바람 같이 우리를 몰아가나이다 7 주의 이름을 부르는 자가 없으며 스스로 분발하여 주를 붙잡는 자가 없사오니 이는 주께서 우리에게 얼굴을 숨기시며 우리의 죄악으로 말미암아 우리가 소멸되게 하셨음이니이다 8 그러나 여호와여, 이제 주는 우리 아버지시니이다 우리는 진흙이요 주는 토기장이시니 우리는 다 주의 손으로 지으신 것이니이다 9 여호와여, 너무 분노하지 마시오며 죄악을 영원히 기억하지 마시옵소서 구하오니 보시옵소서 보시옵소서 우리는 다 주의 백성이니이다"],
["미가 4:1-5","","※ 미가서 4장은 이사야서 2장과 함께 이스라엘 백성이 오랜 세월 간직해 온 평화의 노래를 들려줍니다. 하나님께서 역사를 완성하실 날, 모든 민족이 하나님의 산으로 모여 그분의 길을 배우게 됩니다. 그때 칼은 보습(쟁기)으로, 창은 낫으로 바뀝니다. 평화는 단순히 무기를 없애는 것이 아니라, 파괴에 사용되던 힘이 생명을 살리는 힘으로 변화되는 것입니다. 전쟁하는 법을 배웠듯이 평화도 배워야 합니다. 하나님 나라의 평화는 누구나 자기 포도나무와 무화과나무 아래에서 위협받지 않고 삶의 열매를 누리는 안전함입니다. 폐허와 탄식 한가운데서도 이 약속은 희망의 노래가 됩니다. 대림절의 회개란 단지 내 안의 힘을 없애는 것이 아니라 생명을 살리는 방향으로 새롭게 빚는 일입니다. 우리는 하나님의 이름으로 걸으며, 그분이 이루실 정의와 평화를 기다립니다.","최근 내 말이나 열정, 고집, 재능이 남을 찌르는 '칼'로 쓰인 적은 없는지 돌아보고, 이를 생명을 살리는 '보습(쟁기)'으로 빚기 위해 오늘 바꿀 수 있는 태도는 무엇인가요?","1 끝날에 이르러는 여호와의 전의 산이 산들의 꼭대기에 굳게 서며 작은 산들 위에 뛰어나고 민족들이 그리로 몰려갈 것이라 2 곧 많은 이방 사람들이 가며 이르기를 오라 우리가 여호와의 산에 올라가서 야곱의 하나님의 전에 이르자 그가 그의 도를 가지고 우리에게 가르치실 것이니라 우리가 그의 길로 행하리라 하리니 이는 율법이 시온에서부터 나올 것이요 여호와의 말씀이 예루살렘에서부터 나올 것임이라 3 그가 많은 민족들 사이의 일을 심판하시며 먼 곳 강한 이방 사람을 판결하시리니 무리가 그 칼을 쳐서 보습을 만들고 창을 쳐서 낫을 만들 것이며 이 나라와 저 나라가 다시는 칼을 들고 서로 치지 아니하며 다시는 전쟁을 연습하지 아니하고 4 각 사람이 자기 포도나무 아래와 자기 무화과나무 아래에 앉을 것이라 그들을 두렵게 할 자가 없으리니 이는 만군의 여호와의 입이 이같이 말씀하셨음이라 5 만민이 각각 자기의 신의 이름을 의지하여 행하되 오직 우리는 우리 하나님 여호와의 이름을 의지하여 영원히 행하리로다"],
["미가 4:6–13","","※ 오늘의 말씀은 하나님께서 누구를 새 나라의 백성으로 삼으시는지 보여줍니다. 그들은 승리한 자들이 아니라 비틀거리는 사람들, 사로잡혀 고생하던 사람들, 세상의 기준에서 밀려난 이들입니다. 하나님은 그들을 남은 자로 삼으시고 강한 민족의 씨앗으로 세우십니다. 또한 시온의 고통을 아이를 낳는 여인의 진통에 비유합니다. 고통 자체가 아름다운 것은 아니지만, 하나님은 고통의 한가운데서 새로운 생명을 시작하십니다. 놀랍게도 구원은 바벨론에 끌려가지 않는 방식이 아니라, 바벨론 한복판에서 건짐을 받는 방식으로 찾아옵니다. 이는 인간의 고통 속으로 직접 들어오신 예수 그리스도의 성육신을 떠올리게 합니다. 바벨론의 멸망은 왕들과 상인들에게는 통곡이지만, 약자를 짓밟고 생명까지 상품으로 만들었던 세상의 질서가 무너지는 사건입니다. 하나님 나라의 도래는 밀려난 이들에게는 회복의 희망이며, 약자를 희생시킨 세상에는 심판입니다. 대림절은 바로 그 역전의 날을 기다리는 시간입니다."," 지금 겪고 있는 막막한 현실이나 아픔을 소모적인 고통으로만 여기고 있지는 않은지 돌아보며, 하나님께서 이 과정을 통해 내 삶에 새롭게 탄생시키려 하시는 일은 무엇일까요?","6 여호와께서 말씀하시되 그 날에는 내가 저는 자를 모으며 쫓겨난 자와 내가 환난 받게한 자를 모아 7 그 저는 자로 남은 백성이 되게 하며 멀리 쫓겨났던 자로 강한 나라가 되게 하고 나 여호와가 시온산에서 이제부터 영원까지 그들을 치리하리라 하셨나니 8 너 양떼의 망대요 딸 시온의 산이여 이전 권능 곧 딸 예루살렘의 나라가 네게로 돌아오리라 9 이제 네가 어찌하여 부르짖느냐 너희 중에 왕이 없어졌고 네 모사가 죽었으므로 네가 해산하는 여인처럼 고통함이냐 10 딸 시온이여 해산하는 여인처럼 애써 구로하여 낳을찌어다 이제 네가 성읍에서 나가서 들에 거하며 또 바벨론까지 이르러 거기서 구원을 얻으리니 여호와께서 거기서 너를 너의 원수들의 손에서 속량하여 내시리라 11 이제 많은 이방이 모여서 너를 쳐 이르기를 시온이 더럽게 되며 그것을 우리 눈으로 바라보기를 원하노라 하거니와 12 그들이 여호와의 뜻을 알지 못하며 그 모략을 깨닫지 못한 것이라 여호와께서 곡식 단을 타작마당에 모음 같이 그들을 모으셨나니 13 딸 시온이여 일어나서 칠찌어다 내가 네 뿔을 철 같게 하며 네 굽을 놋 같게 하리니 네가 여러 백성을 쳐서 깨뜨릴 것이라 내가 그들의 탈취물을 구별하여 여호와께 드리며 그들의 재물을 온 땅의 대주재께 돌리리라"],
["미가 5:1–5","","※ 하나님은 크고 강한 중심부가 아니라 변방의 작은 고을 베들레헴에서 구원의 통치를 시작하십니다. 작음을 택하시는 이유는 위대한 일의 근거가 인간의 능력이 아닌 하나님의 신실하심에 있음을 드러내기 위함입니다. 그러므로 우리의 작음은 자격 미달이 아니라 오히려 주님이 일하시는 통로가 됩니다. 우리가 기다리는 왕은 목자처럼 양 떼를 돌보며 그분의 통치가 닿는 곳마다 안전한 평화의 질서를 자라나게 하십니다. 이 평화의 왕을 맞이하려면 '방탕함'이나 ‘세상살이 걱정’에 마음이 짓눌려 무뎌지지 않도록 경계해야 합니다. 대림절의 절제와 기도는 삶의 염려가 차지한 마음의 공간을 비워내고, 예수님처럼 세상 속의 섬김과 하나님 앞에서의 기도를 오가며 깨어 있는 삶입니다.","하나님은 베들레헴 같은 작고 연약한 곳을 통해 신실하심을 드러내시는데, 크기부터 계산하며 망설였던 일은 무엇이고 그 자리에서 일하실 하나님을 어떻게 신뢰할 수 있을까요?","1 딸 군대여 너는 떼를 모을지어다 그들이 우리를 에워쌌으니 막대기로 이스라엘 재판자의 뺨을 치리로다 2 베들레헴 에브라다야 너는 유다 족속 중에 작을지라도 이스라엘을 다스릴 자가 네게서 내게로 나올 것이라 그의 근본은 상고에, 영원에 있느니라 3 그러므로 여인이 해산하기까지 그들을 붙여 두시겠고 그 후에는 그의 형제 가운데에 남은 자가 이스라엘 자손에게로 돌아오리니 4 그가 여호와의 능력과 그의 하나님 여호와의 이름의 위엄을 의지하고 서서 목축하니 그들이 거주할 것이라 이제 그가 창대하여 땅 끝까지 미치리라 5 이 사람은 평강이 될 것이라 앗수르 사람이 우리 땅에 들어와서 우리 궁들을 밟을 때에는 우리가 일곱 목자와 여덟 군왕을 일으켜 그를 치리니"],
["호세아 6:1-6","","※ 하나님은 새벽 여명과 봄비처럼 어김없이 찾아오시지만, 우리의 사랑과 결심은 아침 안개와 이슬처럼 금세 사라지곤 합니다. 성경이 말하는 참된 회개는 일시적인 눈물이나 뜨거운 감정이 아니라, 하나님께로 방향을 돌려 그 길을 끝까지 걸어가는 지속적인 여정입니다. 하나님께서 원하시는 것은 형식적인 제사가 아니라, 언약 안에서 끝까지 지키는 변함없는 사랑(헤세드)과 관계 속에서 그분의 뜻을 따라 살아가는 삶입니다. 데살로니가 성도들이 보여준 믿음의 행위와 사랑의 수고, 소망의 인내처럼 진정한 기다림은 시간을 견디는 열매로 증명됩니다. 결국 다시 오실 주님을 기다리는 대림절의 삶은 내 마음을 사로잡은 우상에게서 돌아서서, 오늘의 감동이 내일의 삶과 관계로 이어지게 하는 것입니다.","다시 오실 주님을 진정으로 기다리기 위해, 지금 내 마음을 가장 크게 사로잡고 있는 '우상'(재물, 인정, 염려, 습관 등) 중 단호히 돌아서야 할 것은 무엇인가요?","1 오라 우리가 여호와께로 돌아가자 여호와께서 우리를 찢으셨으나 도로 낫게 하실 것이요 우리를 치셨으나 싸매어 주실 것임이라 2 여호와께서 이틀 후에 우리를 살리시며 셋째 날에 우리를 일으키시리니 우리가 그의 앞에서 살리라 3 그러므로 우리가 여호와를 알자 힘써 여호와를 알자 그의 나타나심은 새벽 빛 같이 어김없나니 비와 같이, 땅을 적시는 늦은 비와 같이 우리에게 임하시리라 하니라 4 에브라임아 내가 네게 어떻게 하랴 유다야 내가 네게 어떻게 하랴 너희의 인애가 아침 구름이나 쉬 없어지는 이슬 같도다 5 그러므로 내가 선지자들로 그들을 치고 내 입의 말로 그들을 죽였노니 내 심판은 빛처럼 나오느니라 6 나는 인애를 원하고 제사를 원하지 아니하며 번제보다 하나님을 아는 것을 원하노라"],
["예레미야 1:4-10","","※ 하나님의 부르심은 갑작스러운 통보가 아니라 태어나기 전부터 이어온 관계의 결실이며, 그 근거는 우리의 됨됨이가 아닌 부르시는 분의 말씀에 있습니다. 예레미야가 자신의 어림과 미숙함을 내세울 때 하나님은 ‘함께 보호하고 내 말을 네 입에 맡기겠다’는 약속으로 자격의 논리를 뒤집으셨습니다. 대림절은 준비된 자가 주님을 기다리는 때가 아니라, 자격 없는 우리에게 찾아오신 주님께서 우리를 빚어 가시는 시간입니다. 또한 변방의 도시 안디옥에서 이름 없는 몇 사람이 경계를 넘어 복음을 전하며 ‘그리스도인’이라는 새 이름을 낳았듯, 하나님은 오늘도 자격을 따지며 미루는 이들이 아니라 부족해도 순종하며 걸어가는 이들을 통해 일하십니다.","주님은 우리의 자격을 따지는 대신 '내가 늘 너와 함께 보호하고 내 말을 네 입에 맡기겠다'고 약속하시는데, 지금 내 두려움을 이기게 하는 가장 든든한 주님의 약속은 무엇인가요?","4 여호와의 말씀이 내게 임하니라 이르시되 5 내가 너를 모태에 짓기 전에 너를 알았고 네가 배에서 나오기 전에 너를 성별하였고 너를 여러 나라의 선지자로 세웠노라 하시기로 6 내가 이르되 슬프도소이다 주 여호와여 보소서 나는 아이라 말할 줄을 알지 못하나이다 하니 7 여호와께서 내게 이르시되 너는 아이라 말하지 말고 내가 너를 누구에게 보내든지 너는 가며 내가 네게 무엇을 명령하든지 너는 말할지니라 8 너는 그들 때문에 두려워하지 말라 내가 너와 함께 하여 너를 구원하리라 나 여호와의 말이니라 하시고 9 여호와께서 그의 손을 내밀어 내 입에 대시며 여호와께서 내게 이르시되 보라 내가 내 말을 네 입에 두었노라 10 보라 내가 오늘 너를 여러 나라와 여러 왕국 위에 세워 네가 그것들을 뽑고 파괴하며 파멸하고 넘어뜨리며 건설하고 심게 하였느니라 하시니라"],
["에스겔 36:24-28","","※ 에스겔서는 우리의 노력이 아니라 하나님께서 직접 흩어진 백성을 모으시고 돌같이 굳은 마음을 살갗처럼 부드러운 새 마음으로 바꾸어 주시겠다는 ‘심장 이식’ 같은 구원의 약속을 선포합니다. 돌 같은 마음은 상처를 피하려 안으로 걸어 잠근 완고하고 폐쇄적인 마음이며, 종교 지도자들처럼 진리 앞에서조차 무엇이 안전하고 유리한지 손익을 계산하는 자기 보존의 태도입니다. 반면 살갗 같은 새 마음은 다시 아플 수 있지만 이웃의 아픔과 주님의 뜻에 살아 반응하며 공동체를 이루는 마음입니다. 대림절은 더 나은 계산을 구하는 시간이 아니라, 우리 안의 굳은 마음을 제하시고 다시 뛰는 새 마음과 새 영을 불어넣으시는 주님의 은혜를 구하는 시간입니다.","내 스스로 마음을 고쳐먹으려는 노력의 한계를 넘어, 하나님께서 직접 '심장 이식'처럼 새롭게 바꾸어 주셔야 할 내 안의 완고한 영역은 어디인가요?","24 내가 너희를 여러 나라 가운데에서 인도하여 내고 여러 민족 가운데에서 모아 데리고 고국 땅에 들어가서 25 맑은 물을 너희에게 뿌려서 너희로 정결하게 하되 곧 너희 모든 더러운 것에서와 모든 우상 숭배에서 너희를 정결하게 할 것이며 26 또 새 영을 너희 속에 두고 새 마음을 너희에게 주되 너희 육신에서 굳은 마음을 제거하고 부드러운 마음을 줄 것이며 27 또 내 영을 너희 속에 두어 너희로 내 율례를 행하게 하리니 너희가 내 규례를 지켜 행할지라 28 내가 너희 조상들에게 준 땅에서 너희가 거주하면서 내 백성이 되고 나는 너희 하나님이 되리라"],
["이사야 40:1-9","","※ 이사야서 40장의 위로는 여유가 있을 때 베푸는 친절이 아니라, 고난의 밤이 끝나고 하나님의 회복이 온다고 선포하는 주님의 명령이자 공동체의 사명입니다. 주님이 오실 길을 곧게 닦으라는 말씀은 눌린 자를 일으키고 높아진 자리를 낮추어 무너진 존엄을 세우는 삶의 변화이며, 세례 요한처럼 낮아진 자리에서 주님을 맞는 준비입니다. 인간은 풀과 꽃처럼 시들지만 영원히 서 있는 하나님의 말씀이 우리의 연약함을 붙들어 줍니다. 능력의 하나님은 약자를 억누르는 대신 어린 양을 품에 안고 젖 먹이는 양들을 세심히 이끄는 목자로 오시며, 우리는 그 돌봄과 회복의 소식을 전하는 자로 부름받았습니다","풀과 들꽃처럼 스러질 수밖에 없는 나의 한계와 연약함 속에서도, 영원히 서 있는 하나님의 말씀을 붙들어야 할 이유는 무엇일까요?","1 너희의 하나님이 이르시되 너희는 위로하라 내 백성을 위로하라 2 너희는 예루살렘의 마음에 닿도록 말하며 그것에게 외치라 그 노역의 때가 끝났고 그 죄악이 사함을 받았느니라 그의 모든 죄로 말미암아 여호와의 손에서 벌을 배나 받았느니라 할지니라 하시니라 3 외치는 자의 소리여 이르되 너희는 광야에서 여호와의 길을 예비하라 사막에서 우리 하나님의 대로를 평탄하게 하라 4 골짜기마다 돋우어지며 산마다, 언덕마다 낮아지며 고르지 아니한 곳이 평탄하게 되며 험한 곳이 평지가 될 것이요 5 여호와의 영광이 나타나고 모든 육체가 그것을 함께 보리라 이는 여호와의 입이 말씀하셨느니라 6 말하는 자의 소리여 이르되 외치라 대답하되 내가 무엇이라 외치리이까 하니 이르되 모든 육체는 풀이요 그의 모든 아름다움은 들의 꽃과 같으니 7 풀은 마르고 꽃이 시듦은 여호와의 기운이 그 위에 붊이라 이 백성은 실로 풀이로다 8 풀은 마르고 꽃은 시드나 우리 하나님의 말씀은 영원히 서리라 하라 9 아름다운 소식을 시온에 전하는 자여 너는 높은 산에 오르라 아름다운 소식을 예루살렘에 전하는 자여 너는 힘써 소리를 높이라 두려워하지 말고 소리를 높여 유다의 성읍들에게 이르기를 너희의 하나님을 보라 하라"],
["사도행전 2:37-42","","※ 성경이 말하는 희망은 막연한 낙관이 아니라, 어수선한 현실과 고단한 밤 한복판에서도 하나님의 공의로운 통치를 간절히 사모하며 기다리는 일입니다. 하나님의 심판은 불의를 방치하지 않으시는 판결이자 세상이 정의를 배우도록 부르는 초대입니다. 사도행전 2장에서 말씀에 마음이 찔린 이들은 자기를 방어하는 대신 '우리가 어떻게 하면 좋겠습니까?'라는 정직한 책임의 질문으로 새 삶의 문을 열었습니다. 나아가 초대교회는 일시적 감격에 머물지 않고 가르침, 교제, 식탁, 기도라는 거룩한 습관을 통해 서로의 필요를 돌보는 새 공동체를 이루었습니다. 대림절의 기다림 역시 특별한 감정을 붙드는 일이 아니라, 매일의 거룩한 습관으로 우리 몸에 새겨지며 지속됩니다.","가르침, 교제, 식탁, 기도라는 초대교회의 네 가지 기둥 가운데, 오늘 내 삶과 공동체 안에서 가장 회복되어야 할 거룩한 습관은 무엇입니까?","37 그들이 이 말을 듣고 마음에 찔려 베드로와 다른 사도들에게 물어 이르되 형제들아 우리가 어찌할꼬 하거늘 38 베드로가 이르되 너희가 회개하여 각각 예수 그리스도의 이름으로 세례를 받고 죄 사함을 받으라 그리하면 성령의 선물을 받으리니 39 이 약속은 너희와 너희 자녀와 모든 먼 데 사람 곧 주 우리 하나님이 얼마든지 부르시는 자들에게 하신 것이라 하고 40 또 여러 말로 확증하며 권하여 이르되 너희가 이 패역한 세대에서 구원을 받으라 하니 41 그 말을 받은 사람들은 세례를 받으매 이 날에 신도의 수가 삼천이나 더하더라 42 그들이 사도의 가르침을 받아 서로 교제하고 떡을 떼며 오로지 기도하기를 힘쓰니라"],
["사도행전 11:2-17","","※ 사도행전 11장은 하나님의 은혜가 인간이 정해 놓은 경계를 어떻게 넘어서는지를 보여줍니다. 베드로는 평생 지켜 온 경건의 규범 때문에 이방인을 받아들이기를 거부했지만, 하나님께서는 '내가 깨끗하게 한 것을 속되다 하지 말라'고 말씀하십니다. 베드로는 자신의 경건이 오히려 하나님의 일을 가로막을 수 있음을 깨닫고 '내가 누구이기에 하나님을 거역할 수 있겠습니까?'라고 고백합니다. 이방인만 변화한 것이 아닙니다. 베드로도, 예루살렘 교회도 함께 변화했습니다. 하나님은 사람을 구원하실 뿐 아니라 그 사람을 받아들이지 못하는 교회의 마음도 새롭게 하십니다. 우리가 잠가 둔 문으로도 하나님은 찾아오십니다. 교회가 성장한다는 것은 사람을 더 많이 모으는 것이 아니라, 하나님의 은혜를 받아들일 수 있도록 우리의 경계를 넓히는 것입니다.","오랫동안 지켜 온 신앙의 방식 가운데 이제는 하나님께서 새롭게 하시려는 일을 가로막는 것은 없습니까?","2 베드로가 예루살렘에 올라갔을 때에 할례자들이 비난하여 3 이르되 네가 무할례자의 집에 들어가 함께 먹었다 하니 4 베드로가 그들에게 이 일을 차례로 설명하여 5 이르되 내가 욥바 시에서 기도할 때에 황홀한 중에 환상을 보니 큰 보자기 같은 그릇이 네 귀에 매어 하늘로부터 내리어 내 앞에까지 드리워지거늘 6 이것을 주목하여 보니 땅에 네 발 가진 것과 들짐승과 기는 것과 공중에 나는 것들이 보이더라 7 또 들으니 소리 있어 내게 이르되 베드로야 일어나 잡아 먹으라 하거늘 8 내가 이르되 주님 그럴 수 없나이다 속되거나 깨끗하지 아니한 것은 결코 내 입에 들어간 일이 없나이다 하니 9 또 하늘로부터 두 번째 소리 있어 내게 이르되 하나님이 깨끗하게 하신 것을 네가 속되다고 하지 말라 하더라 10 이런 일이 세 번 있은 후에 모든 것이 다시 하늘로 끌려 올라가더라 11 마침 세 사람이 내가 유숙한 집 앞에 서 있으니 가이사랴에서 내게로 보낸 사람이라 12 성령이 내게 명하사 아무 의심 말고 함께 가라 하시매 이 여섯 형제도 나와 함께 가서 그 사람의 집에 들어가니 13 그가 우리에게 말하기를 천사가 내 집에 서서 말하되 네가 사람을 욥바에 보내어 베드로라 하는 시몬을 청하라 14 그가 너와 네 온 집이 구원 받을 말씀을 네게 이르리라 함을 보았다 하거늘 15 내가 말을 시작할 때에 성령이 그들에게 임하시기를 처음 우리에게 하신 것과 같이 하는지라 16 내가 주의 말씀에 요한은 물로 세례를 베풀었으나 너희는 성령으로 세례를 받으리라 하신 것이 생각났노라 17 그런즉 하나님이 우리가 주 예수 그리스도를 믿을 때에 주신 것과 같은 선물을 그들에게도 주셨으니 내가 누구이기에 하나님을 능히 막겠느냐 하더라"],
["누가복음 1:5-17","","※ 한 하나님을 아버지로 모신 공동체에서 서로를 배신하고 언약을 어기는 일은 관계와 신앙의 근원을 흔드는 경고입니다. 큰 대의나 정의를 말하기에 앞서 가장 가까운 사람에게 신실하고 다정했는지 돌아보아야 합니다. 주님은 오랫동안 기다려도 ‘문득’ 찾아오시며 연단하는 불과 표백하는 잿물처럼 우리 삶과 예배를 정결하게 하시므로, 도착 시각을 재기보다 언제든 숨지 않고 맞이할 수 있도록 삶을 열어 두어야 합니다. 누가복음 1장이 전하듯 주님을 맞을 준비는 거창한 일이 아니라 부모와 자녀의 마음이 서로에게 돌아가고 불순종하던 이들이 의인의 지혜로 돌아서며 관계가 회복되는 데서 시작됩니다.","주님은 예고 없이 '문득' 찾아오셔서 연단하는 불과 잿물처럼 정결하게 하시는데, 언제 오셔도 숨지 않고 맞이할 수 있도록 오늘 내 삶과 관계를 정직하게 열어 두어야 할 자리는 어디입니까?","5 유대 왕 헤롯 때에 아비야 반열에 제사장 한 사람이 있었으니 이름은 사가랴요 그의 아내는 아론의 자손이니 이름은 엘리사벳이라 6 이 두 사람이 하나님 앞에 의인이니 주의 모든 계명과 규례대로 흠이 없이 행하더라 7 엘리사벳이 잉태를 못하므로 그들에게 자식이 없고 두 사람의 나이가 많더라 8 마침 사가랴가 그 반열의 차례대로 하나님 앞에서 제사장의 직무를 행할새 9 제사장의 전례를 따라 제비를 뽑아 주의 성전에 들어가 분향하고 10 모든 백성은 그 분향하는 시간에 밖에서 기도하더니 11 주의 사자가 그에게 나타나 향단 우편에 선지라 12 사가랴가 보고 놀라며 무서워하니 13 천사가 그에게 이르되 사가랴여 무서워하지 말라 너의 간구함이 들린지라 네 아내 엘리사벳이 네게 아들을 낳아 주리니 그 이름을 요한이라 하라 14 너도 기뻐하고 즐거워할 것이요 많은 사람도 그의 태어남을 기뻐하리니 15 이는 그가 주 앞에 큰 자가 되며 포도주나 독한 술을 마시지 아니하며 모태로부터 성령의 충만함을 받아 16 이스라엘 자손을 주 곧 그들의 하나님께로 많이 돌아오게 하겠음이라 17 그가 또 엘리야의 심령과 능력으로 주 앞에 먼저 와서 아버지의 마음을 자식에게, 거스르는 자를 의인의 슬기에 돌아오게 하고 주를 위하여 세운 백성을 준비하리라"],
["하박국 2:1-5","","※ 하박국은 악과 불의 앞에서 망대에 서서 항의만 던지지 않고 하나님의 응답을 끝까지 기다립니다. 하나님은 묵시를 판에 새겨 광장의 표지판처럼 전하라 하시며, 폭력과 교만이 영원하지 않고 하나님의 정의가 정한 때에 반드시 이루어진다는 공적 약속을 주십니다. 고통 속에 기다림이 길게 느껴져도 하나님의 약속은 실패하지 않으며 반드시 오십니다. 성경이 말하는 ‘믿음(에무나)’은 다 이해해서가 아니라 폭력과 지연의 시간 속에서도 주님께 신실하고 견고하게 붙어 사는 자세입니다. 기다림은 체념이 아니라 불의를 불의라 부르며 하나님의 약속을 붙드는 능동적 신앙입니다.","기다림의 시간이 길고 더디게 느껴지는 지금, 하나님은 약속을 잊지 않으시며 반드시 오신다는 신뢰가 내 마음속에 어떻게 살아 있습니까?","1 내가 내 파수하는 곳에 서며 성루에 서리라 그가 내게 무엇이라 말씀하실는지 기다리고 바라보며 나의 질문에 대하여 어떻게 대답하실는지 보리라 하였더니 2 여호와께서 내게 대답하여 이르시되 너는 이 묵시를 기록하여 판에 명백히 새기되 달려가면서도 읽을 수 있게 하라 3 이 묵시는 정한 때가 있나니 그 종말이 속히 이르겠고 결코 거짓되지 아니하리라 비록 더딜지라도 기다리라 지체되지 않고 반드시 응하리라 4 보라 그의 마음은 교만하며 그 속에서 정직하지 못하나 의인은 그의 믿음으로 말미암아 살리라 5 그는 술을 즐기며 거짓되고 교만하여 가만히 있지 아니하고 스올처럼 자기의 욕심을 넓히며 또 그는 사망 같아서 족한 줄을 모르고 자기에게로 여러 나라를 모으며 여러 백성을 모으나니"],
["하박국 3:2-6","","※ 하박국의 기도는 과거의 구원을 기억하는 데 머물지 않고, 오늘 우리 시대에도 주님의 일을 새롭게 드러내시며 심판과 진노 중에도 생명과 회복의 자비를 베풀어 달라고 간구합니다. 하나님이 나타나실 때 가장 단단해 보이던 산들조차 무너지듯, 우리가 절대시하던 세상의 질서와 확신은 주님 앞에서 흔들릴 수밖에 없습니다. 대림절의 하나님은 그 흔들림을 통해 마침내 흔들리지 않는 분께 우리가 붙들리게 하십니다. 빌립보서의 바울이 고백했듯 우리의 붙잡음보다 그리스도께서 먼저 우리를 붙드셨기에, 대림절은 과거의 자랑과 실패를 주님께 맡기고 부르시는 앞을 향해 달려가는 은혜의 응답입니다.","과거의 신앙 추억을 기념하는 데만 머물지 않고, 오늘 우리 시대와 내 삶에도 주님의 일을 새롭게 나타내 달라고 간절히 구해야 할 기도는 무엇인가요?","2 여호와여 내가 주께 대한 소문을 듣고 놀랐나이다 여호와여 주는 주의 일을 이 수년 내에 부흥하게 하옵소서 이 수년 내에 나타내시옵소서 진노 중에라도 긍휼을 잊지 마옵소서 3 하나님이 데만에서부터 오시며 거룩한 자가 바란 산에서부터 오시는도다 （셀라） 그의 영광이 하늘을 덮었고 그의 찬송이 세계에 가득하도다 4 그의 광명이 햇빛 같고 광선이 그의 손에서 나오니 그의 권능이 그 속에 감추어졌도다 5 역병이 그 앞에서 행하며 불덩이가 그의 발 밑에서 나오는도다 6 그가 서신즉 땅이 진동하며 그가 보신즉 여러 나라가 전율하며 영원한 산이 무너지며 무궁한 작은 산이 엎드러지나니 그의 행하심이 예로부터 그러하시도다"],
["마태복음 21:28-32","","※ 마태복음 21장의 두 아들 비유는 신앙의 진정성이 말이 아니라 삶의 방향과 행동에 있음을 보여줍니다. 아버지의 요청에 처음에는 거절했지만 뉘우치고 포도원으로 간 아들이 아버지의 뜻을 행한 사람입니다. 반면 순종하겠다고 대답하고도 가지 않은 아들은 말과 삶이 분리된 사람입니다. 예수님은 세례 요한의 회개의 부르심을 받아들인 세리와 죄인들이 종교 지도자들보다 먼저 하나님 나라에 들어간다고 말씀하십니다. 그들의 과거가 아니라 돌이킨 현재가 중요했습니다. 회개는 잘못을 인정하는 말에서 끝나지 않습니다. 삶의 방향을 바꾸어 실제로 포도원으로 걸어가는 것입니다. 대림절의 기다림도 마찬가지입니다. 주님을 기다린다고 말하는 사람이 아니라, 주님의 뜻을 향해 오늘 한 걸음 내딛는 사람이 진정으로 주님을 맞이하는 사람입니다.","입술로는 하나님을 사랑하고 이웃을 섬기겠다고 고백하면서 실제 삶에서는 외면하고 미루는 일이 무엇인가요?","28 그러나 너희 생각에는 어떠하냐 어떤 사람에게 두 아들이 있는데 맏아들에게 가서 이르되 얘 오늘 포도원에 가서 일하라 하니 29 대답하여 이르되 아버지 가겠나이다 하더니 가지 아니하고 30 둘째 아들에게 가서 또 그와 같이 말하니 대답하여 이르되 싫소이다 하였다가 그 후에 뉘우치고 갔으니 31 그 둘 중의 누가 아버지의 뜻대로 하였느냐 이르되 둘째 아들이니이다 예수께서 그들에게 이르시되 내가 진실로 너희에게 이르노니 세리들과 창녀들이 너희보다 먼저 하나님의 나라에 들어가리라 32 요한이 의의 도로 너희에게 왔거늘 너희는 그를 믿지 아니하였으되 세리와 창녀는 믿었으며 너희는 이것을 보고도 끝내 뉘우쳐 믿지 아니하였도다"],
["이사야 61:1-4","","※ 대림절 셋째 주일은 기다림의 한복판에서 기쁨을 기억하는 주일입니다. 이 기쁨은 현실의 고통을 잊는 감정이 아니라, 가난한 자에게 복음이 전해지고 상한 마음이 치유되며 억눌린 자가 자유를 얻는 하나님의 회복에서 비롯됩니다. 예수님은 이사야의 희년 선포를 자신의 사명으로 선언하셨습니다. 하나님은 애통의 재를 화관으로 바꾸시고, 무너진 삶을 다시 세우십니다. 그런데 하나님의 위로는 우리를 위로받는 자리에만 머물게 하지 않습니다. 회복된 사람을 다시 폐허로 보내어 무너진 세상을 세우는 동역자로 부르십니다. 세례 요한처럼 자신이 빛이 되려 하지 않고 참빛이신 그리스도를 증언하는 것이 우리의 사명입니다. 대림절의 기쁨은 주님께서 오신다는 소망이며, 그분의 회복에 참여하고 그분을 세상에 증언하는 삶에서 완성됩니다.","아직도 애통의 재만 바라보고 있나요? 하나님께서 그 상처를 새로운 소명과 생명의 자리로 바꾸어 가시는 것을 믿고 있나요?","1 주 여호와의 영이 내게 내리셨으니 이는 여호와께서 내게 기름을 부으사 가난한 자에게 아름다운 소식을 전하게 하려 하심이라 나를 보내사 마음이 상한 자를 고치며 포로된 자에게 자유를, 갇힌 자에게 놓임을 선포하며 2 여호와의 은혜의 해와 우리 하나님의 보복의 날을 선포하여 모든 슬픈 자를 위로하되 3 무릇 시온에서 슬퍼하는 자에게 화관을 주어 그 재를 대신하며 기쁨의 기름으로 그 슬픔을 대신하며 찬송의 옷으로 그 근심을 대신하시고 그들이 의의 나무 곧 여호와께서 심으신 그 영광을 나타낼 자라 일컬음을 받게 하려 하심이라 4 그들은 오래 황폐하였던 곳을 다시 쌓을 것이며 옛부터 무너진 곳을 다시 일으킬 것이며 황폐한 성읍 곧 대대로 무너져 있던 것들을 중수할 것이며"],
["열왕기상 18:3-8","","※ 열왕기상 18장은 갈멜산의 엘리야뿐 아니라 왕궁의 오바댜를 통해서도 하나님의 역사가 이루어짐을 보여줍니다. 오바댜는 아합의 왕궁에서 일하면서 이세벨의 박해로 죽어 가던 예언자 백 명을 굴에 숨기고 떡과 물을 공급했습니다. 그는 두려움이 없었던 영웅이 아닙니다. 자신의 목숨을 걱정하면서도 생명을 지키는 일을 멈추지 않았습니다. 엘리야가 광야에서 진실을 외쳤다면 오바댜는 왕궁 안에서 조용히 생명을 보호했습니다. 신앙의 용기는 반드시 세상 앞에서 외치는 모습으로만 나타나지 않습니다. 누군가는 진실을 말하고, 누군가는 보이지 않는 곳에서 생명을 지킵니다. 하나님은 드러난 외침뿐 아니라 이름 없는 돌봄의 손길을 통해서도 역사를 이어 가십니다.","오늘 기쁨을 나눌 한 사람은?","3 아합이 왕궁 맡은 자 오바댜를 불렀으니 이 오바댜는 여호와를 지극히 경외하는 자라 4 이세벨이 여호와의 선지자들을 멸할 때에 오바댜가 선지자 백 명을 가지고 오십 명씩 굴에 숨기고 떡과 물을 먹였더라 5 아합이 오바댜에게 이르되 이 땅의 모든 물 근원과 모든 내로 가자 혹시 꼴을 얻으리라 그리하면 말과 노새를 살리리니 짐승을 다 잃지 않게 되리라 하고 6 두 사람이 두루 다닐 땅을 나누어 아합은 홀로 이 길로 가고 오바댜는 홀로 저 길로 가니라 7 오바댜가 길에 있을 때에 엘리야가 그를 만난지라 그가 알아보고 엎드려 말하되 내 주 엘리야여 당신이시니이까 8 그가 그에게 대답하되 그러하다 가서 네 주에게 말하기를 엘리야가 여기 있다 하라"],
["열왕기하 2:9-14","","※ 엘리사는 엘리야에게 갑절의 영을 구했습니다. 이는 스승보다 위대해지려는 욕망이 아니라 맏아들의 상속 몫을 의미하며, 스승의 사명을 이어받고 싶다는 요청이었습니다. 엘리야가 떠난 뒤 엘리사는 자기 옷을 찢고 스승의 겉옷을 주워 듭니다. 계승에는 애도가 따릅니다. 앞선 세대의 상실을 정직하게 받아들일 때 비로소 그 유산은 소유가 아닌 책임이 됩니다. 엘리사는 요단강 앞에서 “엘리야의 하나님은 어디에 계십니까?”라고 묻습니다. 물려받은 신앙이 자신의 신앙이 되는 순간입니다. 그리고 그에게 주어진 능력은 여리고의 오염된 물을 고치는 데 사용됩니다. 하나님의 능력은 과시가 아니라 생명을 회복하는 데 있습니다. 참된 계승은 과거를 복제하는 것이 아니라, 앞선 세대의 믿음을 이어받아 오늘의 상처를 치유하는 것입니다.","앞선 세대와 신앙의 선배들에게 물려받은 유산을 단순한 소유가 아닌 거룩한 책임으로 이어받기 위해, 오늘 내가 정직하게 애도하고 주워 들어야 할 '겉옷'은 무엇인가요?","9 건너매 엘리야가 엘리사에게 이르되 나를 네게서 데려감을 당하기 전에 내가 네게 어떻게 할지를 구하라 엘리사가 이르되 당신의 성령이 하시는 역사가 갑절이나 내게 있게 하소서 하는지라 10 이르되 네가 어려운 일을 구하는도다 그러나 나를 네게서 데려가시는 것을 네가 보면 그 일이 네게 이루어지려니와 그렇지 아니하면 이루어지지 아니하리라 하고 11 두 사람이 길을 가며 말하더니 불수레와 불말들이 두 사람을 갈라놓고 엘리야가 회오리 바람으로 하늘로 올라가더라 12 엘리사가 보고 소리 지르되 내 아버지여 내 아버지여 이스라엘의 병거와 그 마병이여 하더니 다시 보이지 아니하는지라 이에 엘리사가 자기의 옷을 잡아 둘로 찢고 13 엘리야의 몸에서 떨어진 겉옷을 주워 가지고 돌아와 요단 언덕에 서서 14 엘리야의 몸에서 떨어진 그의 겉옷을 가지고 물을 치며 이르되 엘리야의 하나님 여호와는 어디 계시니이까 하고 그도 물을 치매 물이 이리 저리 갈라지고 엘리사가 건너니라"],
["말라기 3:13-18","","※ 말라기 시대에는 악인이 잘되고 하나님을 섬기는 일이 헛되다는 냉소가 퍼져 있었습니다. 그러나 그런 시대에도 하나님을 경외하는 사람들은 서로 믿음의 말을 나누며 신앙의 불씨를 지켰습니다. 하나님은 그들의 작은 대화를 들으시고 비망록에 기록하셨습니다. 하나님께서는 이름 없는 격려와 믿음의 고백도 잊지 않으십니다. 또한 의로운 해가 떠올라 치료하는 광선을 비추리라는 약속은 심판과 치유가 함께하는 하나님의 회복을 보여줍니다. 아버지와 자녀의 마음을 돌이키는 엘리야의 사명처럼 회복은 가장 가까운 관계에서부터 시작됩니다. 그러나 기다리던 엘리야가 이미 왔음에도 사람들은 그를 알아보지 못하고 함부로 대했습니다. 대림절의 경고는 분명합니다. 주님이 오시지 않는 것이 아니라, 오셨는데도 알아보지 못하는 것이 더 큰 비극입니다.","세상이 알아주는 큰 업적이 아니라도 주님을 경외하며 서로의 믿음을 지키는 작은 대화들이 기록된다면, 오늘 내가 주변 사람에게 건네야 할 격려와 믿음의 한마디는 무엇인가요?","13 여호와가 이르노라 너희가 완악한 말로 나를 대적하고도 이르기를 우리가 무슨 말로 주를 대적하였나이까 하는도다 14 이는 너희가 말하기를 하나님을 섬기는 것이 헛되니 만군의 여호와 앞에서 그 명령을 지키며 슬프게 행하는 것이 무엇이 유익하리요 15 지금 우리는 교만한 자가 복되다 하며 악을 행하는 자가 번성하며 하나님을 시험하는 자가 화를 면한다 하노라 함이라 16 그 때에 여호와를 경외하는 자들이 피차에 말하매 여호와께서 그것을 분명히 들으시고 여호와를 경외하는 자와 그 이름을 존중히 여기는 자를 위하여 여호와 앞에 있는 기념책에 기록하셨느니라 17 만군의 여호와가 이르노라 나는 내가 정한 날에 그들을 나의 특별한 소유로 삼을 것이요 또 사람이 자기를 섬기는 아들을 아낌 같이 내가 그들을 아끼리니 18 그 때에 너희가 돌아와서 의인과 악인을 분별하고 하나님을 섬기는 자와 섬기지 아니하는 자를 분별하리라"],
["사무엘하 6:5–11","","※ 다윗이 하나님의 궤를 수레에 실어 옮기다 웃사가 죽은 사건은, 편리함과 우리의 속도에 맞추어 하나님을 통제하려는 태도를 돌아보게 합니다. 열심과 기쁨이 있더라도 하나님을 내 계획과 방향의 도구로 삼으려 할 때 하나님의 거룩한 질서가 무너질 수 있습니다. 궤를 어깨로 메는 방식처럼 하나님의 임재를 가볍거나 편리하게 다루지 않고 책임 있게 감당해야 합니다. 다윗이 내려놓은 궤가 오벳에돔의 집에 복이 되었듯, 하나님은 우리가 통제할 수 없지만 은혜로 함께하시며, 히브리서 1장이 전하듯 아들 예수 그리스도 안에서 친히 우리에게 가까이 오셨습니다.","나는 하나님을 경외한다고 말하면서도 실제로는 내 계획과 편의에 맞게 하나님을 움직이려 하지 않는가?","5 다윗과 이스라엘 온 족속은 잣나무로 만든 여러 가지 악기와 수금과 비파와 소고와 양금과 제금으로 여호와 앞에서 연주하더라 6 그들이 나곤의 타작 마당에 이르러서는 소들이 뛰므로 웃사가 손을 들어 하나님의 궤를 붙들었더니 7 여호와 하나님이 웃사가 잘못함으로 말미암아 진노하사 그를 그 곳에서 치시니 그가 거기 하나님의 궤 곁에서 죽으니라 8 여호와께서 웃사를 치시므로 다윗이 분하여 그 곳을 베레스웃사라 부르니 그 이름이 오늘까지 이르니라 9 다윗이 그 날에 여호와를 두려워하여 이르되 여호와의 궤가 어찌 내게로 오리요 하고 10 다윗이 여호와의 궤를 옮겨 다윗 성 자기에게로 메어 가기를 즐겨하지 아니하고 가드 사람 오벧에돔의 집으로 메어 간지라 11 여호와의 궤가 가드 사람 오벧에돔의 집에 석 달을 있었는데 여호와께서 오벧에돔과 그의 온 집에 복을 주시니라"],
["사무엘하 6:14–19","","※ 다윗은 하나님의 궤를 다시 옮기면서 이전과 달리 서두르지 않고 하나님 앞에 멈추어 제사를 드립니다. 신앙의 회복은 더 큰 행사를 만드는 것이 아니라 하나님을 경외하며 일하는 방식을 새롭게 배우는 데서 시작됩니다. 다윗은 왕의 체면보다 하나님 앞에서 드리는 예배의 기쁨을 앞세워 온 힘을 다해 춤춥니다. 미갈은 그 모습을 업신여기지만, 다윗은 하나님을 찬양하는 일이라면 더 낮아져도 좋다고 말합니다. 그러나 예배의 마지막은 춤으로 끝나지 않습니다. 다윗은 백성 모두에게 음식을 나누어 줍니다. 하나님께 드린 예배가 사람을 향한 나눔으로 이어진 것입니다. 대림절에 우리는 가장 높으신 분이 가장 낮은 자리로 오신 성탄의 역설을 바라봅니다. 진정한 예배는 자신을 낮추고, 기뻐하며, 이웃을 먹이는 삶으로 이어집니다.","남들의 시선과 체면을 계산하느라 주님을 찬양하고 섬기는 자리에서 주저했던 순간을 떠올리며, 오늘 내가 내려놓아야 할 체면은 무엇입니까?","14 다윗이 여호와 앞에서 힘을 다하여 춤을 추는데 그 때에 다윗이 베 에봇을 입었더라 15 다윗과 온 이스라엘 족속이 즐거이 환호하며 나팔을 불고 여호와의 궤를 메어오니라 16 여호와의 궤가 다윗 성으로 들어올 때에 사울의 딸 미갈이 창으로 내다보다가 다윗 왕이 여호와 앞에서 뛰놀며 춤추는 것을 보고 심중에 그를 업신여기니라 17 여호와의 궤를 메고 들어가서 다윗이 그것을 위하여 친 장막 가운데 그 준비한 자리에 그것을 두매 다윗이 번제와 화목제를 여호와 앞에 드리니라 18 다윗이 번제와 화목제 드리기를 마치고 만군의 여호와의 이름으로 백성에게 축복하고 19 모든 백성 곧 온 이스라엘 무리에게 남녀를 막론하고 떡 한 개와 고기 한 조각과 건포도 떡 한 덩이씩 나누어 주매 모든 백성이 각기 집으로 돌아가니라"],
[" 8:9–10","","※ 마오즈(산성·힘)","여호와를 기뻐함이 너희의 힘, 곧 산성이라고 선포합니다. 기쁨은 기분이 아니라 피난처입니다.","오늘 기쁨이 나의 피난처가 되려면?",""],
[" 1:18–25","","※ 임마누엘","요셉의 조용한 순종이 ‘우리와 함께 계신 하나님’의 문을 엽니다.","오늘 ‘함께 계심’을 느낀 순간은?",""],
[" 4:9–12","","※ 사랑은 우리가 먼저 사랑한 것이 아니라 그분이 먼저 보내신 것입니다.","오늘 받은 사랑을 누구에게 흘려보낼까요?",""],
[" 1:1–5, 14","","※ 에스케노센(장막을 치다)","말씀이 육신이 되어 ‘장막을 치셨다’. 광야의 성막처럼 우리 곁에 머무십니다.","그분이 장막을 치실 공간이 내 삶에 있나요?",""],
[" 2:5–8","","※ 에케노센(비우다)","스스로 비우심이 사랑의 모양입니다. 높아지려는 세상에서 낮아짐의 길을 보이십니다.","오늘 내가 비워야 할 것은?",""],
[" 2:1–7","","※ 카탈뤼마(객실)","‘여관에 방이 없었다’는 말은 손님방이 없었다는 뜻일 수 있습니다. 구유는 가장 낮은 자리의 환대입니다.","내 마음의 ‘객실’은 누구에게 열려 있나요?",""],
[" 2:8–20","","※ 첫 소식은 밤을 지키던 목자들에게 갑니다. 성탄은 ‘너희를 위한 구주’의 선포입니다.","오늘 이 기쁜 소식을 누구에게 전할까요?",""]
];

// ===== 상태 =====
const KEY = "advent2026";
let S = {done:{},notes:{}};
try { S = Object.assign(S, JSON.parse(localStorage.getItem(KEY)||"{}")); } catch(e){}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} };
const $ = id => document.getElementById(id);
const day0 = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const wkOf = i => i<7?0:i<14?1:i<21?2:3;
const dateOf = i => new Date(START.getFullYear(), START.getMonth(), START.getDate()+i);
const fmt = d => `${d.getMonth()+1}월 ${d.getDate()}일 ${"일월화수목금토"[d.getDay()]}요일`;
let preview = false, taps = 0;
const cur = () => Math.round((day0(new Date())-START)/864e5);
let sel = Math.min(Math.max(cur(),0),D.length-1);
const unlocked = i => preview || i <= cur();

function render(){
  const c = cur(), i = sel, w = wkOf(i), d = D[i];
  const st = x => x>=26?4:wkOf(x);
  $("candles").innerHTML = [0,1,2,3,4].map(k => `<div class="c c${k+1}${((preview?st(i):st(Math.min(c,26)))>=k && (c>=0||preview))?" on":""}"></div>`).join("");
  $("wk").textContent = i===26 ? "성탄절 · 임마누엘" : `대림 ${WEEKS[w][0]} · ${WEEKS[w][1]}의 촛불`;
  $("banner").innerHTML = (c<0 && !preview) ? `<div class="banner">대림절은 ${-c}일 뒤인 11월 29일에 시작합니다.<br>첫째 날 말씀을 미리 살짝 볼 수 있어요.</div>` : (c>26 ? `<div class="banner">대림절 여정을 마쳤습니다. 지난 말씀을 언제든 다시 읽어 보세요.</div>` : "");
  const ok = unlocked(i) || i===0;
  const dn = !!S.done[i];
  const cnt = Object.keys(S.done).length, pct = Math.round(cnt/D.length*100);
  $("card").innerHTML = `
    <div class="date">${i+1}일째 · ${fmt(dateOf(i))}</div>
    <div class="ref">${d[0]}</div>
    ${d[1] ? `<div class="word">${d[1]}</div>` : ""}
    ${d[4] ? `<div class="txt">${d[4]}</div>` : `<p class="note" style="text-align:left;margin:8px 0">성경을 펼쳐 ${d[0]}을(를) 천천히 두 번 읽어 보세요.</p>`}
    <p class="ins">${d[2]}</p>
    <div class="q"><b>오늘의 질문</b>${d[3]}</div>
    <label for="memo" class="date">나의 묵상 메모 (이 기기에만 저장됩니다)</label>
    <textarea id="memo" placeholder="한두 줄이면 충분합니다."></textarea>
    <button class="btn${dn?" done":""}" id="done">${dn?"읽음 ✓ (눌러서 취소)":"오늘 묵상 마쳤어요"}</button>
    <div class="prog" role="progressbar" aria-label="묵상 진행률" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100">
      <div class="ph"><span>나의 묵상 진행률</span><b>${pct}%</b></div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="pn">${cnt} / ${D.length}일 완료</div>
    </div>`;
  $("memo").value = S.notes[i]||"";
  $("memo").oninput = e => { S.notes[i]=e.target.value; save(); };
  $("done").onclick = () => { S.done[i]=!S.done[i]; if(!S.done[i]) delete S.done[i]; save(); render(); };
  
  const lead = START.getDay();
  let g = "";
  for(let k=0;k<lead;k++) g += "<span></span>";
  for(let k=0;k<D.length;k++){
    const lock = !(unlocked(k) || k===0);
    g += `<button class="d${k===i?" sel":""}${S.done[k]?" done":""}" data-i="${k}" ${lock?"disabled":""} aria-label="${fmt(dateOf(k))}">${dateOf(k).getDate()}</button>`;
  }
  $("grid").innerHTML = g;
  $("grid").querySelectorAll(".d").forEach(b => b.onclick = () => { sel=+b.dataset.i; render(); window.scrollTo({top:0,behavior:"smooth"}); });
  const n = Object.keys(S.done).length;
  $("foot").textContent = `지금까지 ${n}일 묵상했습니다. 날짜가 되면 다음 말씀이 열립니다.`;
}

$("ttl").onclick = () => { if(++taps>=7){ taps=0; preview=!preview; render(); } };
$("share").onclick = async () => {
  const data = {title:"2026 대림절 묵상", text:"하루 한 구절, 대림절 묵상에 함께해요.", url:location.href};
  try { if(navigator.share){ await navigator.share(data); } else { await navigator.clipboard.writeText(location.href); $("foot").textContent="주소를 복사했습니다."; } } catch(e){}
};
$("theme").onclick = () => {
  const r = document.documentElement, dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const now = r.dataset.theme || (dark ? "dark" : "light");
  r.dataset.theme = now==="dark" ? "light" : "dark";
};

// 홈 화면 저장 (안드로이드 자동 프롬프트 지원을 위한 매니페스트 동적 생성 포함)
(function(){
  try {
    const c = document.createElement("canvas");
    c.width = c.height = 180;
    const g = c.getContext("2d");
    g.fillStyle = "#14102b"; g.fillRect(0, 0, 180, 180);
    g.fillStyle = "#6b4aa8"; g.fillRect(78, 88, 24, 62);
    g.fillStyle = "#e8a826"; g.beginPath(); g.ellipse(90, 66, 10, 18, 0, 0, 7); g.fill();
    const iconUrl = c.toDataURL("image/png");

    const l = document.createElement("link");
    l.rel = "apple-touch-icon";
    l.href = iconUrl;
    document.head.appendChild(l);

    // 크롬 등 안드로이드 환경에서 바로 홈화면 추가 창이 뜨도록 돕는 웹앱 매니페스트 동적 추가
    const manifest = {
      name: "2026 남학교회 대림절 묵상집",
      short_name: "대림절묵상",
      start_url: window.location.href,
      display: "standalone",
      background_color: "#14102b",
      theme_color: "#14102b",
      icons: [{ src: iconUrl, sizes: "180x180", type: "image/png" }]
    };
    const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
    const ml = document.createElement("link");
    ml.rel = "manifest";
    ml.href = URL.createObjectURL(blob);
    document.head.appendChild(ml);
  } catch(e){}
})();

const UA = navigator.userAgent;
const isIOS = /iPad|iPhone|iPod/.test(UA) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
const isAnd = /Android/i.test(UA), inApp = /KAKAOTALK|NAVER|FBAN|FBAV|Instagram|Line\//i.test(UA);
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
let dp = null;

addEventListener("beforeinstallprompt", e => { e.preventDefault(); dp = e; });
if (standalone) $("a2hs").hidden = true;

$("a2hs").onclick = async () => {
  const b = $("a2hsBox");
  // 1. 안드로이드 크롬 등 브라우저가 자동 설치를 지원하는 경우 바로 창 띄우기
  if (dp) { 
    dp.prompt(); 
    try { await dp.userChoice; } catch(e){} 
    dp = null; 
    return; 
  }
  
  // 2. 이미 열려있던 안내 상자가 있다면 닫기
  if (!b.hidden) { b.hidden = true; return; }
  
  // 3. 브라우저가 자동 창을 지원하지 않거나(아이폰, 인앱 등) 이벤트가 아직 안 잡힌 경우 안내문 표시
  let h;
  if (inApp) h = `<b>다른 브라우저로 열어 주세요.</b><p style="margin:6px 0 0">지금은 카카오톡 등 앱 안의 브라우저라서 직접 저장할 수 없습니다. 화면 구석의 ⋯ 또는 ⋮ 메뉴에서 <b>‘다른 브라우저로 열기’</b>를 눌러 아이폰은 Safari, 안드로이는 Chrome에서 열고 다시 눌러 주세요.</p>`;
  else if (isIOS) h = `<b>아이폰에서 저장하기 (Safari)</b><ol style="margin:6px 0 0;padding-left:1.2em"><li>화면 아래(또는 위)의 <b>공유 버튼</b>(□에 ↑ 화살표)을 누릅니다.</li><li><b>‘홈 화면에 추가’</b>를 고릅니다.</li><li>오른쪽 위 <b>‘추가’</b>를 누르면 아이콘이 생깁니다.</li></ol>`;
  else if (isAnd) h = `<b>안드로이드에서 저장하기 (Chrome)</b><ol style="margin:6px 0 0;padding-left:1.2em"><li>오른쪽 위 <b>⋮ 메뉴</b>를 누릅니다.</li><li><b>‘홈 화면에 추가’</b> 또는 <b>‘앱 설치’</b>를 고릅니다.</li><li><b>‘추가’</b>를 누르면 아이콘이 생깁니다.</li></ol>`;
  else h = `<b>스마트폰에서 열어 주세요.</b><p style="margin:6px 0 0">이 주소를 아이폰(Safari) 또는 안드로이드(Chrome)로 열고 다시 눌러 주세요.</p>`;
  
  b.innerHTML = h;
  b.hidden = false;
  b.scrollIntoView({behavior:"smooth",block:"nearest"});
};

render();
</script>
</body>
</html>
